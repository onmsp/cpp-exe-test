name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (MSVC)
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Run hello.exe
        run: .\build\Release\hello.exe

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: hello-windows-x64
          path: build/Release/hello.exe
          if-no-files-found: error
